import requests
import yfinance as yf
import pandas as pd
import pandas_ta as ta

# ==================== 🛠️ 请在这里修改你的配置 ====================
STOCK_SYMBOL = "INTC"          # 关注的股票代码（如美股 AAPL，港股 0700.HK，台股 2330.TW）
BOT_TOKEN = "8941207113:AAHKbbtBgf74tdmN9N5Innoo5HmoQudh_Lo"  # 从 @BotFather 获取的那串长钥匙
CHAT_ID = "8243530783"      # 从 @userinfobot 获取的数字 ID
# ================================================================

def get_stock_data_and_rsi():
    print(f"正在获取 {STOCK_SYMBOL} 的最新数据...")
    
    # 1. 获取近期 K 线数据（period 足够长才能准确计算 14 周期的 RSI）
    df_15m = yf.download(tickers=STOCK_SYMBOL, period="3d", interval="15m", progress=False)
    df_30m = yf.download(tickers=STOCK_SYMBOL, period="7d", interval="30m", progress=False)
    
    if df_15m.empty or df_30m.empty:
        print("❌ 获取股票数据失败，请检查股票代码或网络。")
        return None

    # 2. 获取最新股价
    current_price = float(df_15m['Close'].iloc[-1])
    
    # 3. 计算 RSI (周期为 14)
    df_15m.ta.rsi(length=14, append=True)
    df_30m.ta.rsi(length=14, append=True)
    
    # 提取最新的 RSI 值
    rsi_15m = float(df_15m['RSI_14'].iloc[-1])
    rsi_30m = float(df_30m['RSI_14'].iloc[-1])
    
    return current_price, rsi_15m, rsi_30m

def send_telegram_notification(price, rsi_15, rsi_30):
    # 组装格式化完美的文本消息
    text = (
        f"🚨 【股票数据监控】\n"
        f"📌 标的: {STOCK_SYMBOL}\n"
        f"💰 股价: {price:.2f}\n"
        f"📊 15m RSI: {rsi_15:.2f}\n"
        f"📉 30m RSI: {rsi_30:.2f}"
    )
    
    # Telegram 发送消息的官方 API 地址
    url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
    payload = {
        "chat_id": CHAT_ID,
        "text": text
    }
    
    try:
        response = requests.post(url, json=payload, timeout=10)
        res_data = response.json()
        if res_data.get("ok"):
            print("🚀 Telegram 提醒发送成功！")
        else:
            print(f"❌ Telegram 发送失败，请检查 Token 或 Chat ID。错误信息: {response.text}")
    except Exception as e:
        print(f"❌ 网络请求失败（如果在国内本地运行，通常需要开代理）: {e}")

if __name__ == "__main__":
    result = get_stock_data_and_rsi()
    if result:
        price, rsi_15, rsi_30 = result
        print(f"当前价格: {price:.2f} | 15m RSI: {rsi_15:.2f} | 30m RSI: {rsi_30:.2f}")
        send_telegram_notification(price, rsi_15, rsi_30)
